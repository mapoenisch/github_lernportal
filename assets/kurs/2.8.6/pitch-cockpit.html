<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pitch-Cockpit LeadPilot</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;600;700&family=Figtree:wght@400;500;600;700&display=swap">
<style>
:root{
  --ink:#161C2B; --surface:#1E2637; --raised:#28324a; --edge:#38425c;
  --text:#EEF0F6; --dim:#98A1B8; --faint:#6B7590;
  --accent:#7B34FF; --accent-soft:#2A1B54;
  --hot:#F4544F; --warm:#8E63FF; --cold:#5E7E99; --amber:#E8A33D; --go:#3FBF8F;
  --c-v:#E8A33D; --c-g:#3FBF8F; --c-m:#F07AB0; --c-b:#5BB8F0;
  --radius:10px;
  --f-disp:"Archivo","Helvetica Neue",Arial,sans-serif;
  --f-body:"Figtree","Helvetica Neue",Arial,sans-serif;
}
:root[data-theme="light"]{
  --ink:#F4F2F9; --surface:#FFFFFF; --raised:#F0EDF8; --edge:#DCD7EA;
  --text:#1B2233; --dim:#5B6478; --faint:#8892A6;
  --accent:#670BFF; --accent-soft:#EAE0FB;
  --amber:#B8730F; --c-v:#B8730F; --c-g:#1E8A63; --c-m:#C23A7A; --c-b:#1F78B4;
}
@media(prefers-color-scheme:light){
  :root:not([data-theme="dark"]){
    --ink:#F4F2F9; --surface:#FFFFFF; --raised:#F0EDF8; --edge:#DCD7EA;
    --text:#1B2233; --dim:#5B6478; --faint:#8892A6;
    --accent:#670BFF; --accent-soft:#EAE0FB;
    --amber:#B8730F; --c-v:#B8730F; --c-g:#1E8A63; --c-m:#C23A7A; --c-b:#1F78B4;
  }
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--ink); color:var(--text);
  font-family:var(--f-body); font-size:15px; line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3{font-family:var(--f-disp); text-wrap:balance; margin:0}
button{font-family:inherit; color:inherit; cursor:pointer; border:none; background:none}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible{outline:2px solid var(--accent); outline-offset:2px}

/* ---------- Kopfleiste ---------- */
.top{
  position:sticky; top:0; z-index:20; background:var(--surface);
  border-bottom:1px solid var(--edge); padding:10px 20px 14px;
  display:flex; align-items:center; gap:14px; flex-wrap:wrap;
}
.brand{font-family:var(--f-disp); font-weight:700; font-size:15px; letter-spacing:.02em}
.brand span{color:var(--accent)}
.cd{font-size:12.5px; color:var(--dim); font-variant-numeric:tabular-nums}
.cd b{font-family:var(--f-disp); color:var(--text); font-size:14px}
.clockwrap{display:flex; align-items:center; gap:10px; margin-left:auto; flex-wrap:wrap}
.soll{font-size:12.5px; color:var(--dim); font-variant-numeric:tabular-nums; text-align:right}
.soll b{color:var(--text)}
.elapsed{
  font-family:var(--f-disp); font-weight:600; font-size:22px;
  font-variant-numeric:tabular-nums; letter-spacing:.01em; transition:color .3s;
}
.elapsed small{font-size:12px; color:var(--faint); font-weight:500}
.elapsed.half{color:var(--amber)}
.elapsed.end{color:var(--hot)}
.ghost{
  border:1px solid var(--edge); border-radius:99px; padding:5px 13px;
  font-size:12.5px; font-weight:600; color:var(--dim); transition:.15s;
}
.ghost:hover{border-color:var(--accent); color:var(--text)}
.ghost[aria-pressed="true"]{background:var(--accent); border-color:var(--accent); color:#fff}
.go{background:var(--accent); border-color:var(--accent); color:#fff}

/* Zeitleiste: 8 Folien proportional */
.strip{position:absolute; left:0; right:0; bottom:0; height:5px; display:flex; background:var(--raised)}
.strip i{display:block; height:100%; border-right:1px solid var(--surface); position:relative}
.strip i.on{background:var(--accent-soft)}
.fill{position:absolute; left:0; bottom:0; height:5px; background:var(--accent); transition:width .4s; pointer-events:none}

/* ---------- Grundraster ---------- */
.wrap{display:grid; grid-template-columns:268px 1fr; gap:0; min-height:calc(100vh - 60px)}
@media(max-width:900px){.wrap{grid-template-columns:1fr}}

/* ---------- Ablauf links ---------- */
.rail{border-right:1px solid var(--edge); padding:16px 12px; background:var(--surface)}
.rail h2{font-size:10.5px; letter-spacing:.13em; color:var(--faint); text-transform:uppercase; margin:14px 0 8px 8px}
.rail h2:first-child{margin-top:0}
.step{
  width:100%; text-align:left; display:grid; grid-template-columns:52px 1fr;
  gap:9px; padding:8px; border-radius:8px; align-items:start; transition:.14s;
  border-left:3px solid transparent;
}
.step:hover{background:var(--raised)}
.step[aria-current="true"]{background:var(--accent-soft); border-left-color:var(--accent)}
.step .t{font-family:var(--f-disp); font-size:11.5px; font-weight:600; color:var(--faint); font-variant-numeric:tabular-nums; padding-top:2px}
.step[aria-current="true"] .t{color:var(--accent)}
.step .n{display:block; font-size:13.5px; font-weight:600; line-height:1.3}
.step .m{display:block; font-size:10.5px; color:var(--faint); margin-top:2px}
.step.done .n{color:var(--dim)}
.step.soll .t::after{content:" ●"; color:var(--go)}

/* ---------- Bühne rechts ---------- */
.stage{padding:22px 26px 40px; max-width:980px}
.mode{
  display:inline-block; font-size:10px; font-weight:700; letter-spacing:.13em;
  padding:4px 11px; border-radius:99px; text-transform:uppercase; margin-bottom:11px;
}
.mode.slide{background:var(--accent); color:#fff}
.mode.prep{background:var(--raised); color:var(--dim); border:1px solid var(--edge)}
.mode.post{background:var(--go); color:#08231A}
.stage h1{font-size:30px; font-weight:700; line-height:1.15; margin-bottom:5px}
.range{font-size:13px; color:var(--faint); font-variant-numeric:tabular-nums; margin-bottom:18px}
.lead{font-size:15px; color:var(--dim); margin:0 0 18px; max-width:720px}

.say{
  background:var(--raised); border-left:3px solid var(--accent);
  border-radius:0 var(--radius) var(--radius) 0; padding:16px 20px; margin-bottom:12px;
}
.say .lab{font-size:9.5px; font-weight:700; letter-spacing:.13em; color:var(--accent); text-transform:uppercase; margin-bottom:8px}
.say p{margin:0 0 12px; font-size:18px; line-height:1.6}
.say p:last-child{margin-bottom:0}
.say strong{font-weight:700; box-shadow:inset 0 -3px 0 var(--accent)}
.say em.hint{color:var(--amber); font-style:italic; font-size:14px; display:block; margin-top:10px}

/* Regie-Chips im Text */
.chip{
  display:inline-block; font-size:11.5px; font-weight:700; line-height:1.3;
  padding:1px 8px; border-radius:99px; vertical-align:2px; margin:0 2px;
  border:1px solid currentColor; white-space:nowrap;
}
.chip.v{color:var(--c-v)} .chip.v::before{content:"♪ "}
.chip.g{color:var(--c-g)} .chip.g::before{content:"✋ "}
.chip.m{color:var(--c-m)} .chip.m::before{content:"☺ "}
.chip.b{color:var(--c-b)} .chip.b::before{content:"◎ "}
.chip.k{color:#fff; background:var(--accent); border-color:var(--accent); letter-spacing:.08em; font-size:10.5px}
.pz{font-family:var(--f-disp); font-weight:700; color:var(--amber); padding:0 3px}
.pz.long{background:var(--amber); color:#1B1405; border-radius:4px; padding:0 6px; font-size:12px; vertical-align:2px}
.opt{text-decoration:underline dotted var(--faint); text-underline-offset:4px; color:var(--dim)}
.opt::after{content:" ✂"; color:var(--faint); font-size:12px}

.legend{display:flex; flex-wrap:wrap; gap:6px 14px; font-size:12px; color:var(--faint); margin:0 0 20px; align-items:center}
.legend strong{box-shadow:inset 0 -3px 0 var(--accent); color:var(--text)}

.regie{display:grid; grid-template-columns:repeat(4,1fr); gap:10px; margin-bottom:16px}
@media(max-width:900px){.regie{grid-template-columns:1fr 1fr}}
.rc{background:var(--surface); border:1px solid var(--edge); border-radius:var(--radius); padding:11px 13px; border-top:3px solid var(--edge)}
.rc h3{font-size:10px; font-weight:700; letter-spacing:.13em; text-transform:uppercase; margin-bottom:5px}
.rc p{margin:0; font-size:13.5px}
.rc.v{border-top-color:var(--c-v)} .rc.v h3{color:var(--c-v)}
.rc.g{border-top-color:var(--c-g)} .rc.g h3{color:var(--c-g)}
.rc.m{border-top-color:var(--c-m)} .rc.m h3{color:var(--c-m)}
.rc.b{border-top-color:var(--c-b)} .rc.b h3{color:var(--c-b)}

.trapbox{
  background:var(--surface); border:1px solid var(--amber); border-radius:var(--radius);
  padding:11px 15px; margin-bottom:16px; font-size:14px;
}
.trapbox b{color:var(--amber); font-family:var(--f-disp); font-size:10px; letter-spacing:.13em; text-transform:uppercase; display:block; margin-bottom:3px}

.cols{display:grid; grid-template-columns:1fr 1fr; gap:16px; margin-bottom:18px}
@media(max-width:760px){.cols{grid-template-columns:1fr}}
.blk h3{font-size:10px; font-weight:700; letter-spacing:.13em; color:var(--faint); text-transform:uppercase; margin-bottom:8px}
.blk ul{margin:0; padding-left:17px}
.blk li{margin-bottom:5px; font-size:14px}
.blk li::marker{color:var(--accent)}
.card{background:var(--surface); border:1px solid var(--edge); border-radius:var(--radius); padding:15px 17px}

/* Checklisten */
.chk{list-style:none; padding:0; margin:0}
.chk li{margin:0 0 4px}
.chk label{display:grid; grid-template-columns:20px 1fr; gap:8px; align-items:start; font-size:14px; cursor:pointer; padding:3px 4px; border-radius:6px}
.chk label:hover{background:var(--raised)}
.chk input{accent-color:var(--accent); width:16px; height:16px; margin:2px 0 0}
.chk input:checked + span{color:var(--faint); text-decoration:line-through}

/* Arbeitsplatz-Skizze */
.desk{display:grid; grid-template-columns:1fr 1.25fr; gap:18px; align-items:end; margin-bottom:8px}
@media(max-width:760px){.desk{grid-template-columns:1fr}}
.scr{border:2px solid var(--edge); border-radius:10px; background:var(--surface); padding:10px; position:relative}
.scr .cap{font-family:var(--f-disp); font-size:11px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; color:var(--faint); margin-bottom:8px}
.scr .zone{border-radius:7px; padding:9px 11px; font-size:13px; margin-top:6px}
.scr .zone b{display:block; font-size:13.5px}
.zone.share{background:var(--accent-soft); border:1px dashed var(--accent); min-height:150px; display:flex; flex-direction:column; justify-content:center; text-align:center}
.zone.cock{background:var(--accent); color:#fff}
.zone.zoom{background:var(--raised); border:1px solid var(--edge)}
.cam{width:10px; height:10px; border-radius:50%; background:var(--go); box-shadow:0 0 0 4px rgba(63,191,143,.25); margin:0 auto 6px}
.foot{font-size:11.5px; color:var(--faint); text-align:center; margin-top:7px}
.tagline{display:inline-block; font-size:10px; font-weight:700; letter-spacing:.1em; text-transform:uppercase; padding:2px 8px; border-radius:99px; margin-top:6px}
.tagline.shared{background:var(--hot); color:#fff}
.tagline.private{background:var(--go); color:#08231A}
.eye{text-align:center; font-size:13px; color:var(--dim); margin:4px 0 22px}

/* Countdown & Zeitplan */
.big{
  font-family:var(--f-disp); font-size:58px; font-weight:700; line-height:1;
  font-variant-numeric:tabular-nums; letter-spacing:-.02em;
}
.big.soon{color:var(--amber)} .big.now{color:var(--go)}
.cdbox{background:var(--surface); border:1px solid var(--edge); border-radius:var(--radius); padding:18px 22px; margin-bottom:20px; display:grid; grid-template-columns:auto 1fr; gap:26px; align-items:center}
@media(max-width:640px){.cdbox{grid-template-columns:1fr}}
.cdbox label{font-size:12.5px; color:var(--dim); display:block; margin-bottom:5px}
.cdbox input[type=time]{
  font-family:var(--f-disp); font-size:20px; font-weight:600; background:var(--raised);
  color:var(--text); border:1px solid var(--edge); border-radius:7px; padding:6px 10px;
}
.tl{display:grid; gap:8px}
.ph{display:grid; grid-template-columns:78px 1fr; gap:14px; padding:11px 13px; border-radius:var(--radius); background:var(--surface); border:1px solid var(--edge); opacity:.62; transition:.3s}
.ph.live{opacity:1; background:var(--accent-soft); border-color:var(--accent)}
.ph.past{opacity:.45}
.ph .when{font-family:var(--f-disp); font-weight:700; font-variant-numeric:tabular-nums}
.ph .when small{display:block; font-size:11px; color:var(--faint); font-weight:600}
.ph h3{font-size:14px; margin-bottom:4px}

/* Atem-Pacer */
.breath{display:grid; grid-template-columns:150px 1fr; gap:20px; align-items:center}
@media(max-width:640px){.breath{grid-template-columns:1fr}}
.orb{width:130px; height:130px; border-radius:50%; display:grid; place-items:center; position:relative}
.orb::before{content:""; position:absolute; inset:0; border-radius:50%; background:var(--accent-soft); border:2px solid var(--accent); transform:scale(.55); transition:transform 4s linear}
.orb.in::before,.orb.hold1::before{transform:scale(1)}
.orb span{position:relative; font-family:var(--f-disp); font-weight:700; font-size:15px; text-align:center}
.orb span small{display:block; font-size:26px}
.tbtn{
  background:var(--accent); color:#fff; border-radius:7px; padding:8px 17px;
  font-size:13.5px; font-weight:600; transition:.15s;
}
.tbtn:hover{filter:brightness(1.12)}
.tbtn.sec{background:var(--raised); color:var(--dim); border:1px solid var(--edge)}
.rep{display:grid; grid-template-columns:1fr auto; gap:14px; align-items:center; padding:12px 0; border-bottom:1px solid var(--edge)}
.rep:last-child{border-bottom:none}
.rep p{margin:0; font-size:15px}
.rep p b{display:block; font-size:10px; letter-spacing:.13em; text-transform:uppercase; color:var(--faint); margin-bottom:3px}
.cnt{font-family:var(--f-disp); font-weight:700; font-variant-numeric:tabular-nums; min-width:92px}
.cnt.ok{background:var(--go); color:#08231A; border-color:var(--go)}

/* Q&A */
.q{border-bottom:1px solid var(--edge); padding:12px 0; display:grid; grid-template-columns:26px 1fr; gap:12px}
.q:last-child{border-bottom:none}
.q .num{font-family:var(--f-disp); font-size:12px; color:var(--faint); font-variant-numeric:tabular-nums; padding-top:2px}
.q .qq{font-weight:600; margin-bottom:3px}
.q .aa{color:var(--dim); font-size:14px}
.ph-hold{color:var(--amber); font-weight:600}

/* ---------- Panels ---------- */
.tabs{display:flex; gap:6px; margin:30px 0 14px; border-bottom:1px solid var(--edge); flex-wrap:wrap}
.tab{padding:8px 14px; font-size:13.5px; font-weight:600; color:var(--faint); border-bottom:2px solid transparent; margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--text); border-bottom-color:var(--accent)}
.tab:hover{color:var(--dim)}
table{width:100%; border-collapse:collapse; font-size:13.5px}
.scroll{overflow-x:auto}
th{
  text-align:left; font-family:var(--f-disp); font-size:10px; font-weight:700;
  letter-spacing:.1em; text-transform:uppercase; color:var(--faint);
  padding:7px 9px; border-bottom:1px solid var(--edge); white-space:nowrap;
}
td{padding:9px; border-bottom:1px solid var(--edge); vertical-align:top}
tr:last-child td{border-bottom:none}
.num-c{font-family:var(--f-disp); font-weight:700; font-variant-numeric:tabular-nums; white-space:nowrap}
.verb{background:var(--raised); border-radius:var(--radius); padding:14px 18px; margin-top:16px}
.verb p{margin:0 0 9px; font-size:15px}
.verb p:last-child{margin:0}
.verb b{color:var(--accent); font-size:10px; letter-spacing:.13em; text-transform:uppercase; display:block}
.fullscript h3{font-size:15px; margin:22px 0 8px}
.fullscript h3:first-child{margin-top:0}
.fullscript h3 small{font-family:var(--f-body); font-weight:500; color:var(--faint); font-size:12.5px; margin-left:6px}
.fullscript p{margin:0 0 9px; font-size:15.5px; line-height:1.6}
.fullscript strong{box-shadow:inset 0 -3px 0 var(--accent)}

.nav{display:flex; gap:10px; margin-top:26px; padding-top:18px; border-top:1px solid var(--edge)}
.nav button{
  flex:1; padding:12px; border-radius:8px; background:var(--raised);
  border:1px solid var(--edge); font-weight:600; font-size:14px; transition:.15s;
}
.nav button:hover:not(:disabled){border-color:var(--accent)}
.nav button:disabled{opacity:.35; cursor:default}
.hidden{display:none}

.stage .thumb{float:right; width:300px; aspect-ratio:16/9; object-fit:cover; margin:0 0 14px 20px; border-radius:8px; border:1px solid var(--line,#333)}
@media (max-width:700px){.stage .thumb{float:none; display:block; width:100%; margin:0 0 14px}}
/* ---------- Fokusmodus fürs Live-Pitchen ---------- */
body.focus .wrap{grid-template-columns:1fr}
body.focus .rail, body.focus .tabs, body.focus [role=tabpanel], body.focus .nav, body.focus .legend, body.focus .cols{display:none}
body.focus .stage{max-width:1100px; margin:0 auto; padding-top:16px}
body.focus .say p{font-size:23px; line-height:1.55}
body.focus .stage h1{font-size:24px}

@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<header class="top">
  <div class="brand">LeadPilot Pitch · <span>Cockpit</span></div>
  <button class="ghost" id="themeBtn">Hell</button>
  <button class="ghost" id="focusBtn" aria-pressed="false" title="Taste F">Fokus</button>
  <div class="cd" id="cdTop"></div>
  <div class="clockwrap">
    <div class="soll" id="soll">Soll-Zeit: 5:00 · Fenster 4:15–5:45</div>
    <div class="elapsed" id="elapsed">00:00 <small>/ 05:00</small></div>
    <button class="ghost" id="followBtn" aria-pressed="true" title="Cockpit springt automatisch zur Folie, auf der du laut Zeitplan sein solltest">Mitlaufen</button>
    <button class="ghost go" id="pitchBtn" aria-pressed="false">Pitch starten</button>
    <button class="ghost" id="resetBtn" title="Pitch-Uhr zurücksetzen">Reset</button>
  </div>
  <div class="strip" id="strip"></div>
  <div class="fill" id="fill" style="width:0"></div>
</header>

<div class="wrap">
  <nav class="rail" aria-label="Ablauf"><div id="rail"></div></nav>

  <main class="stage">
    <div id="block"></div>

    <div class="tabs" role="tablist">
      <button class="tab" role="tab" aria-selected="true" data-panel="cheat">Spickzettel</button>
      <button class="tab" role="tab" aria-selected="false" data-panel="script">Komplettes Skript</button>
      <button class="tab" role="tab" aria-selected="false" data-panel="sos">Notfall &amp; Blackout</button>
    </div>
    <section id="cheat" role="tabpanel"></section>
    <section id="script" role="tabpanel" class="hidden"></section>
    <section id="sos" role="tabpanel" class="hidden"></section>

    <div class="nav">
      <button id="prev">← Zurück</button>
      <button id="next">Weiter →</button>
    </div>
  </main>
</div>

<script>
/* ===================== Inhalte ===================== */
/* Markup im Sprechtext:

/* ===================== Helfer ===================== */
const $ = (s,r)=> (r||document).querySelector(s);
function fmt(s){ s=Math.max(0,Math.floor(s)); return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0"); }
function mmss(s){ s=Math.max(0,Math.round(s)); return Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }

function mk(s){
  return s
    .replace(/\s*\|\|\s*/g,' <span class="pz long" title="lange Pause">‖ 3 s</span> ')
    .replace(/\s*\|\s*/g,' <span class="pz" title="kurze Pause">‖</span> ')
    .replace(/\[k\]/g,'<span class="chip k">KLICK</span>')
    .replace(/\[([vgmb]):([^\]]+)\]/g,(_,t,x)=>'<span class="chip '+t+'">'+x+'</span>')
    .replace(/~([^~]+)~/g,'<span class="opt" title="kürzbar bei Zeitnot">$1</span>')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
}

/* Lokaler Speicher (nur Komfort, Seite funktioniert auch ohne) */
const STORE_KEY = "leadpilotPitchCockpit.v1";
let store = {};
try{ store = JSON.parse(localStorage.getItem(STORE_KEY)||"{}") || {}; }catch(e){ store = {}; }
function save(){ try{ localStorage.setItem(STORE_KEY, JSON.stringify(store)); }catch(e){} }
store.checks = store.checks || {};
store.reps = store.reps || {};

function chkList(prefix, items){
  return '<ul class="chk">'+items.map((it,i)=>{
    const id = prefix+"-"+i;
    return '<li><label><input type="checkbox" data-chk="'+id+'"'+(store.checks[id]?' checked':'')+'><span>'+it+'</span></label></li>';
  }).join("")+'</ul>';
}
function bindChecks(root){
  root.querySelectorAll("[data-chk]").forEach(cb=>{
    cb.onchange = ()=>{ store.checks[cb.dataset.chk] = cb.checked; save(); };
  });
}

/* ===================== Zustand ===================== */
let cur = FIRST_SLIDE - PREP.length; // startet bei Arbeitsplatz
let follow = true;
let pStart = null, pInt = null, preroll = 0, preInt = null;

/* ===================== Ablaufleiste ===================== */
function sollIndex(){
  if(pStart===null) return -1;
  const e = (Date.now()-pStart)/1000;
  for(let i=SLIDES.length-1;i>=0;i--) if(e>=SLIDES[i].from) return i;
  return 0;
}
function drawRail(){
  const si = sollIndex();
  const grp = {prep:"Vorbereitung", slide:"Pitch · 5:00", post:"Danach"};
  let last = "", h = "";
  BLOCKS.forEach((b,i)=>{
    if(b.kind!==last){ h += '<h2>'+grp[b.kind]+'</h2>'; last = b.kind; }
    const meta = b.kind==="slide" ? "Folie "+(b.idx+1)+" · "+b.dur+" s" : b.m;
    const soll = b.kind==="slide" && b.idx===si;
    h += '<button class="step'+(i<cur?' done':'')+(soll?' soll':'')+'" data-i="'+i+'"'+(i===cur?' aria-current="true"':'')+'>'+
         '<span class="t">'+b.t+'</span><span><span class="n">'+b.name+'</span><span class="m">'+meta+'</span></span></button>';
  });
  $("#rail").innerHTML = h;
  $("#rail").querySelectorAll(".step").forEach(el=>
    el.onclick = ()=>{ go(+el.dataset.i, true); window.scrollTo({top:0,behavior:"smooth"}); });
}

/* ===================== Bühne ===================== */
function drawBlock(){
  const b = BLOCKS[cur];
  stopBreath();
  let h = "";
  if(b.kind==="slide") h = slideView(b);
  else if(b.key==="setup") h = setupView();
  else if(b.key==="plan") h = planView();
  else if(b.key==="warm") h = warmView();
  else if(b.key==="qa") h = qaView();
  $("#block").innerHTML = h;
  bindChecks($("#block"));
  if(b.key==="plan") bindPlan();
  if(b.key==="warm") bindWarm();
  $("#prev").disabled = cur===0;
  $("#next").disabled = cur===BLOCKS.length-1;
}

function slideView(s){
  const end = s.from+s.dur;
  return '<img class="thumb" src="'+THUMBS[s.idx]+'" alt="Miniatur Folie '+(s.idx+1)+'">'+
    '<span class="mode slide">Folie '+(s.idx+1)+' von '+SLIDES.length+' · '+s.name+'</span>'+
    '<h1>'+s.title+'</h1>'+
    '<div class="range">Soll '+mmss(s.from)+' – '+mmss(end)+' · '+s.dur+' Sekunden</div>'+
    '<div class="say"><div class="lab">Sprechtext</div>'+s.say.map(p=>'<p>'+mk(p)+'</p>').join("")+
    (s.hint?'<em class="hint">'+s.hint+'</em>':'')+'</div>'+
    legend()+
    (s.trap?'<div class="trapbox"><b>Achtung, Hakstelle</b>'+s.trap+'</div>':'')+

    '<div class="blk"><h3>Steht auf der Folie</h3><p style="margin:0;font-size:14px;color:var(--dim)">'+s.onslide+'</p></div></div>';
}

function startDate(){ return store.target ? new Date(store.target) : null; }

function shiftCountdown(min){ if(!store.target) return; store.target += min*60000; save(); paintPlan(); paintTop(); }

   '<div style="display:flex;gap:6px;margin-top:12px"><button class="ghost" id="cdMinus">−1 Min</button><button class="ghost" id="cdPlus">+1 Min</button><button class="ghost" id="cdStop">Stopp</button></div></div></div>'+
   '<div class="tl" id="tl">'+PLAN.map((p,i)=>
     '<div class="ph" data-off="'+(p.off===null?"":p.off)+'" id="ph'+i+'"><div class="when" id="w'+i+'">'+(p.off===null?"Vorabend":(p.off===0?"Start":"T"+p.off))+'</div>'+
     '<div><h3>'+p.lab+'</h3>'+chkList("p"+i,p.items)+'</div></div>').join("")+'</div>';
}
function bindPlan(){
  $("#block").querySelectorAll("[data-cd]").forEach(b=> b.onclick = ()=> setCountdown(+b.dataset.cd));
  $("#cdGo").onclick = ()=>{ const m = parseFloat($("#cdMin").value); if(m>0) setCountdown(m); };
  $("#cdMin").onkeydown = e=>{ if(e.key==="Enter") $("#cdGo").click(); };
  $("#cdMinus").onclick = ()=> shiftCountdown(-1);
  $("#cdPlus").onclick = ()=> shiftCountdown(1);
  $("#cdStop").onclick = clearCountdown;
  paintPlan();
}
function paintPlan(){
  const big = $("#bigCd"); if(!big) return;
  const d = startDate();
  PLAN.forEach((p,i)=>{
    const w = $("#w"+i), ph = $("#ph"+i);
    if(p.off===null){ ph.classList.remove("live","past"); return; }
    const lbl = p.off===0 ? "Start" : "T"+p.off;
    if(!d){ w.innerHTML = lbl; ph.classList.remove("live","past"); return; }
    const t = new Date(d.getTime()+p.off*60000);
    w.innerHTML = String(t.getHours()).padStart(2,"0")+":"+String(t.getMinutes()).padStart(2,"0")+'<small>'+lbl+'</small>';
    const next = PLAN[i+1] ? d.getTime()+PLAN[i+1].off*60000 : t.getTime()+10*60000;
    const now = Date.now();
    ph.classList.toggle("live", now>=t.getTime() && now<next);
    ph.classList.toggle("past", now>=next);
  });
  const sub = $("#cdSub");
  if(!d){ big.textContent="--:--"; big.className="big"; sub.textContent="Countdown läuft noch nicht."; return; }
  const diff = Math.round((d.getTime()-Date.now())/1000);
  if(diff>0){
    const h=Math.floor(diff/3600), m=Math.floor(diff%3600/60), s=diff%60;
    big.textContent = (h?h+":"+String(m).padStart(2,"0"):String(m).padStart(2,"0"))+":"+String(s).padStart(2,"0");
    big.className = "big"+(diff<=600?" soon":"");
    sub.textContent = "bis zum Start um "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")+" Uhr";
  } else {
    big.textContent = "Jetzt."; big.className = "big now";
    sub.textContent = "Du bist dran. Atmen, lächeln, „Herr Hartwig …“";
  }
}
function paintTop(){
  const d = startDate(), el = $("#cdTop");
  if(!d){ el.innerHTML = ""; return; }
  const diff = Math.round((d.getTime()-Date.now())/1000);
  if(diff>0){
    const h=Math.floor(diff/3600), m=Math.floor(diff%3600/60), s=diff%60;
    el.innerHTML = 'Start in <b>'+(h?h+":":"")+String(m).padStart(2,"0")+":"+String(s).padStart(2,"0")+'</b>';
  } else el.innerHTML = '<b style="color:var(--go)">Showtime</b>';
}

function rep(k,lab,txt){
  const n = store.reps[k]||0;
  return '<div class="rep"><p><b>'+lab+'</b>'+txt+'</p><button class="ghost cnt'+(n>=2?' ok':'')+'" data-rep="'+k+'">'+n+' / 2 laut</button></div>';
}
function bindWarm(){
  $("#block").querySelectorAll("[data-rep]").forEach(b=>{
    b.onclick = ()=>{ const k=b.dataset.rep; store.reps[k]=((store.reps[k]||0)+1)%4; save();
      const n=store.reps[k]; b.textContent=n+" / 2 laut"; b.classList.toggle("ok",n>=2); };
  });
  $("#breathBtn").onclick = ()=> bInt ? stopBreath() : startBreath();
}
let bInt=null;
function startBreath(){
  const phases=[["in","Einatmen"],["hold1","Halten"],["out","Ausatmen"],["hold2","Halten"]];
  let p=0, s=4; const orb=$("#orb"), txt=$("#orbTxt");
  const paint=()=>{ orb.className="orb "+phases[p][0]; txt.innerHTML=phases[p][1]+"<small>"+s+"</small>"; };
  paint(); $("#breathBtn").textContent="Stopp";
  bInt=setInterval(()=>{ s--; if(s===0){ s=4; p=(p+1)%4; } paint(); },1000);
}
function stopBreath(){
  clearInterval(bInt); bInt=null;
  const b=$("#breathBtn"); if(b) b.textContent="Atmen starten";
  const o=$("#orb"); if(o){ o.className="orb"; $("#orbTxt").innerHTML="Bereit<small>4</small>"; }
}

document.querySelectorAll(".tab").forEach(tab=>{
  tab.onclick = ()=>{
    document.querySelectorAll(".tab").forEach(t=>t.setAttribute("aria-selected", t===tab));
    ["cheat","script","sos"].forEach(p=> $("#"+p).classList.toggle("hidden", p!==tab.dataset.panel));
  };
});

/* ===================== Pitch-Uhr ===================== */
function drawStrip(){
  $("#strip").innerHTML = SLIDES.map((s,i)=>'<i style="width:'+(s.dur/TOTAL*100)+'%" id="seg'+i+'" title="Folie '+(i+1)+' · '+s.name+'"></i>').join("");
}
$("#pitchBtn").onclick = function(){
  if(pStart!==null || preInt){ stopPitch(); return; }
  preroll = 5;
  this.textContent = "Start in "+preroll; this.setAttribute("aria-pressed","true");
  $("#elapsed").innerHTML = 'Klick in die Folien <small>· '+preroll+'</small>';
  preInt = setInterval(()=>{
    preroll--;
    if(preroll>0){ $("#pitchBtn").textContent = "Start in "+preroll; $("#elapsed").innerHTML = 'Klick in die Folien <small>· '+preroll+'</small>'; return; }
    clearInterval(preInt); preInt=null;
    pStart = Date.now(); $("#pitchBtn").textContent = "Stopp";
    if(follow) go(FIRST_SLIDE, false);
    tick(); pInt = setInterval(tick, 250);
  },1000);
};
function stopPitch(){
  clearInterval(preInt); preInt=null; clearInterval(pInt); pInt=null;
  const b=$("#pitchBtn"); b.textContent = pStart!==null ? "Weiter starten" : "Pitch starten";
  b.setAttribute("aria-pressed","false");
  if(pStart!==null){ store.lastRun = Math.round((Date.now()-pStart)/1000); save(); }
  pStart = null; tick(true);
}
$("#resetBtn").onclick = ()=>{
  clearInterval(preInt); preInt=null; clearInterval(pInt); pInt=null; pStart=null;
  $("#pitchBtn").textContent="Pitch starten"; $("#pitchBtn").setAttribute("aria-pressed","false");
  $("#elapsed").innerHTML='00:00 <small>/ 05:00</small>'; $("#elapsed").className="elapsed";
  $("#fill").style.width="0"; $("#soll").innerHTML="Soll-Zeit: 5:00 · Fenster 4:15–5:45";
  SLIDES.forEach((s,i)=>$("#seg"+i).classList.remove("on")); drawRail();
};
let lastSoll = -1;
function tick(stopped){
  if(stopped){
    const last = store.lastRun;
    if(last!=null) $("#soll").innerHTML = 'Letzter Lauf: <b>'+mmss(last)+'</b>'+(last<255?' · zu kurz':last>345?' · zu lang':' · im Fenster');
    return;
  }
  const e = (Date.now()-pStart)/1000;
  const el = $("#elapsed");
  el.innerHTML = fmt(e)+' <small>/ 05:00</small>';
  el.className = "elapsed"+(e>=345?" end":(e>=300?" half":""));
  $("#fill").style.width = Math.min(100, e/TOTAL*100)+"%";
  const si = sollIndex(), s = SLIDES[si];
  SLIDES.forEach((x,i)=>$("#seg"+i).classList.toggle("on", i<=si));
  const left = s.from+s.dur-e;
  $("#soll").innerHTML = left>0
    ? 'Soll: <b>Folie '+(si+1)+'</b> · noch '+mmss(left)
    : 'Soll: <b>fertig</b> · '+(e>=345?'über dem Fenster':'+'+mmss(e-TOTAL));
  if(si!==lastSoll){ lastSoll = si; if(follow) go(FIRST_SLIDE+si, false); else drawRail(); }
}
$("#followBtn").onclick = function(){
  follow = !follow; this.setAttribute("aria-pressed", follow);
  if(follow && pStart!==null){ lastSoll=-1; tick(); }
};

/* ===================== Navigation ===================== */
function go(i, manual){
  cur = Math.max(0, Math.min(BLOCKS.length-1, i));
  if(manual && pStart!==null && follow){ follow=false; $("#followBtn").setAttribute("aria-pressed","false"); }
  drawRail(); drawBlock();
}
$("#prev").onclick = ()=> go(cur-1, true);
$("#next").onclick = ()=> go(cur+1, true);
document.addEventListener("keydown", e=>{
  if(e.target.tagName==="INPUT") return;
  if(e.target.tagName==="BUTTON" && e.key===" ") return;
  if(e.key==="ArrowRight") go(cur+1, true);
  if(e.key==="ArrowLeft")  go(cur-1, true);
  if(e.key==="f"||e.key==="F") $("#focusBtn").click();
});
$("#focusBtn").onclick = function(){
  const on = document.body.classList.toggle("focus");
  this.setAttribute("aria-pressed", on);
};

/* ===================== Theme ===================== */
function isLight(){
  const st = document.documentElement.getAttribute("data-theme");
  if(st) return st==="light";
  return window.matchMedia("(prefers-color-scheme: light)").matches;
}
function labelTheme(){ $("#themeBtn").textContent = isLight() ? "Dunkel" : "Hell"; }
$("#themeBtn").onclick = ()=>{
  const t = isLight()?"dark":"light";
  document.documentElement.setAttribute("data-theme", t);
  store.theme = t; save(); labelTheme();
};
if(store.theme) document.documentElement.setAttribute("data-theme", store.theme);
labelTheme();

/* ===================== Start ===================== */
drawStrip(); drawRail(); drawBlock(); drawCheat(); drawScript(); drawSos();
paintTop(); tick(true);
setInterval(()=>{ paintTop(); paintPlan(); }, 1000);
</script>
