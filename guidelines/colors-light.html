<!-- @dsCard group="Colors" viewport="700x200" name="Neutrals — light paper" subtitle="Content column on #F5F4F0" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--surface-page);font-family:var(--font-body);padding:20px}
  .row{display:flex;gap:14px;flex-wrap:wrap}
  .sw{width:105px}
  .chip{height:60px;border-radius:12px;border:1px solid var(--dba-border)}
  .name{font-family:var(--font-display);font-weight:700;font-size:12.5px;color:var(--dba-ink);margin-top:8px}
  .hex{font-size:11.5px;color:var(--dba-muted);font-variant-numeric:tabular-nums}
</style></head><body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--dba-paper)"></div><div class="name">Paper</div><div class="hex">#F5F4F0</div></div>
    <div class="sw"><div class="chip" style="background:var(--dba-card)"></div><div class="name">Card</div><div class="hex">#FFFFFF</div></div>
    <div class="sw"><div class="chip" style="background:var(--dba-border)"></div><div class="name">Border</div><div class="hex">#E4E1D9</div></div>
    <div class="sw"><div class="chip" style="background:var(--dba-ink)"></div><div class="name">Ink</div><div class="hex">#14171E</div></div>
    <div class="sw"><div class="chip" style="background:var(--dba-body)"></div><div class="name">Body</div><div class="hex">#565C69</div></div>
    <div class="sw"><div class="chip" style="background:var(--dba-muted)"></div><div class="name">Muted</div><div class="hex">#9AA0AC</div></div>
  </div>
</body></html>
