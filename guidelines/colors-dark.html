<!-- @dsCard group="Colors" viewport="700x200" name="Neutrals — dark shell" subtitle="Sidebar & header chrome on #14161C" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--dba-shell);font-family:var(--font-body);padding:20px}
  .row{display:flex;gap:14px;flex-wrap:wrap}
  .sw{width:118px}
  .chip{height:60px;border-radius:12px;border:1px solid rgba(255,255,255,.08)}
  .name{font-family:var(--font-display);font-weight:700;font-size:12.5px;color:#fff;margin-top:8px}
  .hex{font-size:11.5px;color:var(--dba-on-dark-3);font-variant-numeric:tabular-nums}
</style></head><body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--dba-shell)"></div><div class="name">Shell</div><div class="hex">#14161C</div></div>
    <div class="sw"><div class="chip" style="background:var(--dba-on-dark-2)"></div><div class="name">Text</div><div class="hex">#AEB3BE</div></div>
    <div class="sw"><div class="chip" style="background:var(--dba-on-dark-3)"></div><div class="name">Secondary</div><div class="hex">#8A8F9C</div></div>
    <div class="sw"><div class="chip" style="background:var(--dba-on-dark-4)"></div><div class="name">Tertiary</div><div class="hex">#666B79</div></div>
    <div class="sw"><div class="chip" style="background:var(--dba-on-dark-mint)"></div><div class="name">Mint · codes</div><div class="hex">#7FC7B9</div></div>
  </div>
</body></html>
