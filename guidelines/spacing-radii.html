<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--surface-page);font-family:var(--font-body);padding:22px;display:flex;gap:20px;align-items:flex-end;flex-wrap:wrap}
  .item{text-align:center}
  .box{width:88px;height:64px;background:#fff;border:1px solid var(--dba-border)}
  .lab{font-family:var(--font-display);font-weight:700;font-size:12px;color:var(--dba-ink);margin-top:8px}
  .use{font-size:10.5px;color:var(--dba-muted)}
</style></head><body>
  <div class="item"><div class="box" style="border-radius:8px"></div><div class="lab">8px</div><div class="use">buttons · rows</div></div>
  <div class="item"><div class="box" style="border-radius:11px"></div><div class="lab">11px</div><div class="use">inputs · tile</div></div>
  <div class="item"><div class="box" style="border-radius:13px"></div><div class="lab">13px</div><div class="use">cycle node</div></div>
  <div class="item"><div class="box" style="border-radius:16px"></div><div class="lab">16px</div><div class="use">cards · lanes</div></div>
  <div class="item"><div class="box" style="border-radius:99px;width:110px"></div><div class="lab">99px</div><div class="use">chips · badges</div></div>
</body></html>
