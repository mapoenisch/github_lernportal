<!-- @dsCard group="Colors" viewport="700x150" name="Card surfaces" subtitle="White · teal-tint · accent-tint · deep-teal" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--surface-page);font-family:var(--font-body);padding:20px;display:flex;gap:16px;flex-wrap:wrap}
  .card{width:150px;box-sizing:border-box;border-radius:var(--radius-xl);padding:18px 18px}
  .t{font-family:var(--font-display);font-weight:700;font-size:14px;margin:0 0 5px}
  .p{font-size:12.5px;line-height:1.5;margin:0}
</style></head><body>
  <div class="card" style="background:#fff;border:1px solid var(--dba-border)"><p class="t" style="color:var(--dba-ink)">White</p><p class="p" style="color:var(--dba-body)">Default card surface.</p></div>
  <div class="card" style="background:var(--surface-teal);border:1px solid var(--surface-teal-border)"><p class="t" style="color:var(--dba-ink)">Teal tint</p><p class="p" style="color:var(--dba-body)">Emphasis / definition.</p></div>
  <div class="card" style="background:var(--surface-accent);border:1px solid var(--surface-accent-border)"><p class="t" style="color:var(--dba-ink)">Accent tint</p><p class="p" style="color:#6B5C55">Caution / contrast.</p></div>
  <div class="card" style="background:var(--dba-teal-deep);border:0"><p class="t" style="color:#fff">Deep teal</p><p class="p" style="color:#D6E7E3">Hero stat / callout.</p></div>
</body></html>
