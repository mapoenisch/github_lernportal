<!-- @dsCard group="Colors" viewport="700x210" name="Tone families" subtitle="Five step/lane tones — solid · tint · hairline" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--surface-page);font-family:var(--font-body);padding:20px}
  .row{display:flex;gap:14px;flex-wrap:wrap}
  .fam{width:118px}
  .stack{display:flex;flex-direction:column;border-radius:12px;overflow:hidden;border:1px solid var(--dba-border)}
  .solid{height:34px}
  .tint{height:20px}
  .name{font-family:var(--font-display);font-weight:700;font-size:12.5px;color:var(--dba-ink);margin-top:8px}
  .hex{font-size:11px;color:var(--dba-muted);font-variant-numeric:tabular-nums}
</style></head><body>
  <div class="row">
    <div class="fam"><div class="stack"><div class="solid" style="background:var(--tone-teal)"></div><div class="tint" style="background:var(--tone-teal-bg)"></div><div class="tint" style="background:var(--tone-teal-line)"></div></div><div class="name">Teal</div><div class="hex">#22707B</div></div>
    <div class="fam"><div class="stack"><div class="solid" style="background:var(--tone-slate)"></div><div class="tint" style="background:var(--tone-slate-bg)"></div><div class="tint" style="background:var(--tone-slate-line)"></div></div><div class="name">Slate</div><div class="hex">#3B4A63</div></div>
    <div class="fam"><div class="stack"><div class="solid" style="background:var(--tone-plum)"></div><div class="tint" style="background:var(--tone-plum-bg)"></div><div class="tint" style="background:var(--tone-plum-line)"></div></div><div class="name">Plum</div><div class="hex">#7C5680</div></div>
    <div class="fam"><div class="stack"><div class="solid" style="background:var(--tone-sky)"></div><div class="tint" style="background:var(--tone-sky-bg)"></div><div class="tint" style="background:var(--tone-sky-line)"></div></div><div class="name">Sky</div><div class="hex">#2B6CA3</div></div>
    <div class="fam"><div class="stack"><div class="solid" style="background:var(--tone-rose)"></div><div class="tint" style="background:var(--tone-rose-bg)"></div><div class="tint" style="background:var(--tone-rose-line)"></div></div><div class="name">Rose</div><div class="hex">#A64D5F</div></div>
  </div>
</body></html>
