<!-- @dsCard group="Colors" viewport="700x180" name="Brand" subtitle="Teal primary, coral accent" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--surface-page);font-family:var(--font-body);padding:20px}
  .row{display:flex;gap:14px;flex-wrap:wrap}
  .sw{width:120px}
  .chip{height:66px;border-radius:12px;border:1px solid rgba(0,0,0,.06)}
  .name{font-family:var(--font-display);font-weight:700;font-size:12.5px;color:var(--dba-ink);margin-top:8px}
  .hex{font-size:11.5px;color:var(--dba-muted);font-variant-numeric:tabular-nums}
</style></head><body>
  <div class="row">
    <div class="sw"><div class="chip" style="background:var(--dba-teal)"></div><div class="name">Teal · primary</div><div class="hex">#22707B</div></div>
    <div class="sw"><div class="chip" style="background:var(--dba-teal-deep)"></div><div class="name">Teal deep</div><div class="hex">#123E45</div></div>
    <div class="sw"><div class="chip" style="background:var(--dba-teal-light)"></div><div class="name">Teal light</div><div class="hex">#7FC7B9</div></div>
    <div class="sw"><div class="chip" style="background:var(--dba-coral)"></div><div class="name">Coral · accent</div><div class="hex">#E4694B</div></div>
    <div class="sw"><div class="chip" style="background:var(--dba-coral-deep)"></div><div class="name">Coral deep</div><div class="hex">#B84A2E</div></div>
  </div>
</body></html>
