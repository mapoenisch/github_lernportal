<!-- @dsCard group="Spacing" viewport="700x180" name="Spacing scale" subtitle="4 → 34px steps + section rhythm" -->
<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--surface-page);font-family:var(--font-body);padding:22px}
  .row{display:flex;align-items:center;gap:12px;margin-bottom:9px}
  .bar{height:14px;background:var(--dba-teal);border-radius:3px}
  .lab{font-family:var(--font-display);font-weight:700;font-size:11.5px;color:var(--dba-ink);width:44px;font-variant-numeric:tabular-nums}
  .use{font-size:11px;color:var(--dba-muted)}
</style></head><body>
  <div class="row"><span class="lab">8</span><div class="bar" style="width:8px"></div><span class="use">step number tile radius, sidebar row padding</span></div>
  <div class="row"><span class="lab">16</span><div class="bar" style="width:16px"></div><span class="use">card grid gap</span></div>
  <div class="row"><span class="lab">22</span><div class="bar" style="width:22px"></div><span class="use">card padding (vertical)</span></div>
  <div class="row"><span class="lab">34</span><div class="bar" style="width:34px"></div><span class="use">flow column gap (arrow runway) · content pad-x</span></div>
  <div class="row"><span class="lab">64</span><div class="bar" style="width:64px"></div><span class="use">between content sections</span></div>
</body></html>
