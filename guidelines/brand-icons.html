<!DOCTYPE html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--surface-page);font-family:var(--font-body);padding:22px;display:flex;gap:22px;flex-wrap:wrap}
  .g{text-align:center}
  .glyph{font-family:var(--font-display);font-weight:800;font-size:26px;color:var(--dba-teal);height:34px;line-height:34px}
  .lab{font-size:11px;color:var(--dba-muted);margin-top:4px}
</style></head><body>
  <div class="g"><div class="glyph">⌕</div><div class="lab">search</div></div>
  <div class="g"><div class="glyph" style="color:var(--dba-coral)">✓</div><div class="lab">complete</div></div>
  <div class="g"><div class="glyph">▾</div><div class="lab">expand</div></div>
  <div class="g"><div class="glyph">▸</div><div class="lab">collapse</div></div>
  <div class="g"><div class="glyph">→</div><div class="lab">flow</div></div>
  <div class="g"><div class="glyph">↓</div><div class="lab">row break</div></div>
  <div class="g"><div class="glyph">↻</div><div class="lab">cycle</div></div>
  <div class="g"><div class="glyph">▶</div><div class="lab">progression</div></div>
  <div class="g"><div class="glyph">↗</div><div class="lab">resource</div></div>
</body></html>
