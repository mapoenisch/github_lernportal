<!doctype html><html lang="de"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;overflow:hidden;background:#F7F7FB;font:400 15px/1.5 Inter,sans-serif;color:#111827}
header{height:64px;background:#fff;border-bottom:1px solid #E5E7EB;display:flex;align-items:center;justify-content:space-between;padding:0 32px}
.logo{font-weight:700}
.tabs span{margin-left:24px;color:#6B7280}.tabs .on{color:#4F46E5;font-weight:600}
.wrap{width:760px;margin:48px auto}
.bar{height:8px;background:#E5E7EB;border-radius:99px}.bar i{display:block;width:40%;height:100%;background:#4F46E5;border-radius:99px}
.meta{display:flex;justify-content:space-between;color:#6B7280;font-size:14px;margin:10px 0 22px}
.card{background:#fff;border-radius:20px;box-shadow:0 10px 30px rgba(17,24,39,.08);padding:56px;text-align:center;min-height:360px}
.chip{display:inline-block;background:#EEF2FF;color:#4F46E5;font-size:13px;font-weight:600;padding:5px 12px;border-radius:99px}
h1{font:700 34px/1.25 Inter;margin:26px 0 18px}
textarea{width:100%;height:110px;border:1px solid #E5E7EB;border-radius:12px;padding:14px;font:inherit}
.btns{display:flex;gap:12px;justify-content:center;margin-top:26px}
.b{padding:14px 26px;border-radius:12px;font-weight:600}.p{background:#4F46E5;color:#fff}.s{background:#fff;border:1px solid #E5E7EB}
</style></head><body>
<header><div class="logo">Zertifizierungstrainer</div><div class="tabs"><span class="on">Lernen</span><span>Begriffe</span><span>Statistik</span></div></header>
<div class="wrap">
 <div class="bar"><i></i></div>
 <div class="meta"><span>Tag 3 · Lektion 1</span><span>11 von 28</span></div>
 <div class="card">
  <span class="chip">Lead Management</span>
  <h1>Wie funktioniert Lead Scoring, und welche Entscheidung unterstützt es?</h1>
  <textarea placeholder="Deine Antwort"></textarea>
  <div class="btns"><span class="b s">Überspringen</span><span class="b p">Antwort prüfen</span></div>
 </div>
</div>
</body></html>
