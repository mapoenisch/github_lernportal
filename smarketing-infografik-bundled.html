  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

-items: center;\n            justify-content: center;\n            min-height: 100vh;\n            margin: 0;\n            overflow: auto;\n            padding: 2rem;\n        }\n\n        /* Feste Leinwand für die Folie (16:9 Ratio, HD) */\n        .slide-canvas {\n            width: 1280px;\n            height: 720px;\n            background-color: #F8FAFC;\n            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);\n            flex-shrink: 0;\n            display: flex;\n            flex-direction: column;\n            position: relative;\n            overflow: hidden;\n            border-radius: 12px;\n        }\n\n        .gradient-text {\n            background: linear-gradient(135deg, #F97316 0%, #8B5CF6 50%, #3B82F6 100%);\n            -webkit-background-clip: text;\n            -webkit-text-fill-color: transparent;\n        }\n\n        /* Angepasste Scrollbar für den KI-Bereich auf der Folie */\n        .custom-scrollbar::-webkit-scrollbar {\n            width: 4px;\n        }\n        .custom-scrollbar::-webkit-scrollbar-track {\n            background: #F1F5F9; \n        }\n        .custom-scrollbar::-webkit-scrollbar-thumb {\n            background: #CBD5E1; \n            border-radius: 4px;\n        }\n        \n        .card {\n            background: white;\n            border-radius: 12px;\n            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);\n            border: 1px solid #E2E8F0;\n            display: flex;\n            flex-direction: column;\n            padding: 1rem;\n        }\n    <\u002Fstyle>\n<\u002Fhead>\n<body class=\"antialiased text-slate-800\">\n\n\n    <div class=\"slide-canvas\">\n        \n        <!-- HEADER -->\n        <header class=\"h-[12%] px-8 flex justify-between items-center bg-white border-b border-slate-200 shrink-0\">\n            <div>\n                <h1 class=\"text-4xl font-black tracking-tight text-slate-900 leading-none\">\n                    SMARKETING <span class=\"text-xl font-medium text-slate-400 tracking-normal ml-2\">Die perfekte Pipeline<\u002Fspan>\n                <\u002Fh1>\n            <\u002Fdiv>\n            <div class=\"flex items-center gap-4 text-sm font-bold uppercase tracking-widest\">\n                <span class=\"text-orange-500 flex items-center gap-1\"><div class=\"w-3 h-3 rounded-full bg-orange-500\"><\u002Fdiv> Marketing<\u002Fspan>\n                <span class=\"text-violet-500 flex items-center gap-1\"><div class=\"w-3 h-3 rounded-full bg-violet-500\"><\u002Fdiv> Smarketing<\u002Fspan>\n                <span class=\"text-blue-500 flex items-center gap-1\"><div class=\"w-3 h-3 rounded-full bg-blue-500\"><\u002Fdiv> Sales<\u002Fspan>\n            <\u002Fdiv>\n        <\u002Fheader>\n\n        <!-- MAIN CONTENT GRID -->\n        <div class=\"flex-1 p-6 grid grid-cols-3 gap-6 h-[88%]\">\n            \n            <!-- COLUMN 1: Funnel & Meetings -->\n            <div class=\"flex flex-col gap-6 h-full\">\n                \n                <!-- 1. Funnel -->\n                <div class=\"card flex-1\">\n                    <h2 class=\"text-xs font-bold uppercase tracking-widest text-slate-400 mb-3\">1. Der gemeinsame Funnel<\u002Fh2>\n                    \n                    <div class=\"flex-1 relative mb-2\">\n                        <canvas id=\"funnelChart\"><\u002Fcanvas>\n                    <\u002Fdiv>\n                    \n                    <div class=\"space-y-3 mt-2 text-sm\">\n                        <div class=\"flex gap-3 items-start\">\n                            <div class=\"w-1.5 h-full min-h-[40px] bg-orange-500 rounded-full shrink-0\"><\u002Fdiv>\n                            <div>\n                                <h3 class=\"font-bold text-slate-800 leading-tight\">TOFU/MOFU <span class=\"text-orange-500 text-xs font-normal\">(Marketing)<\u002Fspan><\u002Fh3>\n                                <p class=\"text-[11px] text-slate-500 leading-tight mt-0.5\">Ziel: Günstige Lead-Generierung. Ergebnis: <strong>MQLs<\u002Fstrong>.<\u002Fp>\n                            <\u002Fdiv>\n                        <\u002Fdiv>\n                        <div class=\"flex gap-3 items-start bg-violet-50 p-2 rounded-lg -ml-2 border border-violet-100\">\n                            <div class=\"w-1.5 h-full min-h-[40px] bg-violet-500 rounded-full shrink-0\"><\u002Fdiv>\n                            <div>\n                                <h3 class=\"font-bold text-slate-800 leading-tight\">Die Übergabe<\u002Fh3>\n                                <p class=\"text-[11px] text-slate-700 leading-tight mt-0.5\"><strong>70%<\u002Fstrong> der Kaufentscheidung fallen <em>vor<\u002Fem> dem ersten Sales-Kontakt!<\u002Fp>\n                            <\u002Fdiv>\n                        <\u002Fdiv>\n                        <div class=\"flex gap-3 items-start\">\n                            <div class=\"w-1.5 h-full min-h-[40px] bg-blue-500 rounded-full shrink-0\"><\u002Fdiv>\n                            <div>\n                                <h3 class=\"font-bold text-slate-800 leading-tight\">BOFU <span class=\"text-blue-500 text-xs font-normal\">(Sales)<\u002Fspan><\u002Fh3>\n                                <p class=\"text-[11px] text-slate-500 leading-tight mt-0.5\">Ziel: Lead-Konvertierung &amp; Beratung. Ergebnis: <strong>SQLs<\u002Fstrong> &amp; Umsatz.<\u002Fp>\n                            <\u002Fdiv>\n                        <\u002Fdiv>\n                    <\u002Fdiv>\n                <\u002Fdiv>\n\n                <!-- 4. POP Meetings -->\n                <div class=\"card shrink-0 h-[140px] bg-gradient-to-br from-slate-900 to-slate-800 text-white border-none\">\n                    <h2 class=\"text-[10px] font-bold uppercase tracking-widest text-slate-400 mb-2\">4. Smarketing Meetings<\u002Fh2>\n                    <div class=\"flex justify-between items-center h-full\">\n                        <div class=\"text-center w-1/3\">\n                            <div class=\"text-2xl font-black text-violet-400 mb-1\">P<\u002Fdiv>\n                            <h5 class=\"font-bold text-xs\">Purpose<\u002Fh5>\n                            <p class=\"text-[9px] text-slate-400 mt-0.5\">Wieso?<\u002Fp>\n                        <\u002Fdiv>\n                        <div class=\"text-slate-600 text-sm\">➔<\u002Fdiv>\n                        <div class=\"text-center w-1/3\">\n                            <div class=\"text-2xl font-black text-violet-400 mb-1\">O<\u002Fdiv>\n                            <h5 class=\"font-bold text-xs\">Outcomes<\u002Fh5>\n                            <p class=\"text-[9px] text-slate-400 mt-0.5\">Was?<\u002Fp>\n                        <\u002Fdiv>\n                        <div class=\"text-slate-600 text-sm\">➔<\u002Fdiv>\n                        <div class=\"text-center w-1/3\">\n                            <div class=\"text-2xl font-black text-violet-400 mb-1\">P<\u002Fdiv>\n                            <h5 class=\"font-bold text-xs\">Process<\u002Fh5>\n                            <p class=\"text-[9px] text-slate-400 mt-0.5\">Wie?<\u002Fp>\n                        <\u002Fdiv>\n                    <\u002Fdiv>\n                <\u002Fdiv>\n            <\u002Fdiv>\n\n            <!-- COLUMN 2: SLAs -->\n            <div class=\"flex flex-col gap-6 h-full\">\n                \n                <div class=\"card bg-slate-50 border-none shadow-none p-0 flex flex-col justify-center text-center\">\n                    <h2 class=\"text-xs font-bold uppercase tracking-widest text-slate-400 mb-1\">2. Service Level Agreements (SLA)<\u002Fh2>\n                    <p class=\"text-xs text-slate-500\">Verbindliche Versprechen eliminieren das \"Blame Game\".<\u002Fp>\n                <\u002Fdiv>\n\n                <!-- Marketing SLA -->\n                <div class=\"card flex-1 bg-orange-50 border-orange-100 relative overflow-hidden\">\n                    <div class=\"absolute -right-4 -top-4 text-7xl opacity-10\">🎯<\u002Fdiv>\n                    <h4 class=\"font-bold text-orange-600 text-[10px] uppercase tracking-wider mb-2\">Marketing liefert<\u002Fh4>\n                    <p class=\"text-3xl font-black text-slate-800 mb-2\">Volumen<\u002Fp>\n                    <p class=\"text-xs text-slate-600 leading-relaxed max-w-[85%] mt-auto\">\"Wir liefern jeden Monat eine fest definierte Anzahl an hochqualifizierten MQLs, die dem Zielkundenprofil entsprechen.\"<\u002Fp>\n                <\u002Fdiv>\n\n                <!-- Sales SLA -->\n                <div class=\"card flex-[1.5] bg-blue-50 border-blue-100 relative overflow-hidden\">\n                    <div class=\"absolute -right-4 -bottom-4 text-7xl opacity-10\">⚡<\u002Fdiv>\n                    <h4 class=\"font-bold text-blue-600 text-[10px] uppercase tracking-wider mb-2\">Sales garantiert<\u002Fh4>\n                    <p class=\"text-3xl font-black text-slate-800 mb-2\">Speed to Lead<\u002Fp>\n                    \n                    <div class=\"flex-1 relative w-full flex items-center justify-center my-2\">\n                        <div class=\"w-full h-[100px] relative\">\n                            <canvas id=\"speedChart\"><\u002Fcanvas>\n                        <\u002Fdiv>\n                    <\u002Fdiv>\n\n                    <p class=\"text-[11px] text-slate-600 leading-relaxed font-semibold\">8x geringere Kontakt-Rate nach 5 Min!<\u002Fp>\n                    <p class=\"text-[10px] text-slate-500 leading-relaxed mt-1\">\"Wir kontaktieren qualifizierte Leads sofort nach Erhalt.\"<\u002Fp>\n                <\u002Fdiv>\n\n            <\u002Fdiv>\n\n            <!-- COLUMN 3: Problems & AI -->\n            <div class=\"flex flex-col gap-6 h-full\">\n                \n                <!-- 3. Wenn es hakt -->\n                <div class=\"card shrink-0\">\n                    <h2 class=\"text-xs font-bold uppercase tracking-widest text-slate-400 mb-4\">3. Wenn es hakt (Lösungen)<\u002Fh2>\n                    \n                    <div class=\"space-y-4\">\n                        <div class=\"flex gap-3\">\n                            <div class=\"text-xl\">📉<\u002Fdiv>\n                            <div>\n                                <h4 class=\"font-bold text-slate-800 text-xs\">Zu wenig Leads?<\u002Fh4>\n                                <p class=\"text-[10px] text-slate-500 leading-tight\">Lösung: Content-Produktion &amp; Volumen erhöhen.<\u002Fp>\n                            <\u002Fdiv>\n                        <\u002Fdiv>\n                        <div class=\"flex gap-3\">\n                            <div class=\"text-xl\">🌊<\u002Fdiv>\n                            <div>\n                                <h4 class=\"font-bold text-slate-800 text-xs\">Sales überlastet?<\u002Fh4>\n                                <p class=\"text-[10px] text-slate-500 leading-tight\">Lösung: Sales Velocity (Win-Rate/Deal Value) steigern.<\u002Fp>\n                            <\u002Fdiv>\n                        <\u002Fdiv>\n                        <div class=\"flex gap-3\">\n                            <div class=\"text-xl\">⚠️<\u002Fdiv>\n                            <div>\n                                <h4 class=\"font-bold text-slate-800 text-xs\">Schlechte Qualität?<\u002Fh4>\n                                <p class=\"text-[10px] text-slate-500 leading-tight\">Lösung: Präzisere Botschaften (\"Great Content!\").<\u002Fp>\n                            <\u002Fdiv>\n                        <\u002Fdiv>\n                        <div class=\"flex gap-3\">\n                            <div class=\"text-xl\">⚖️<\u002Fdiv>\n                            <div>\n                                <h4 class=\"font-bold text-slate-800 text-xs\">Subjektive Ablehnung?<\u002Fh4>\n                                <p class=\"text-[10px] text-slate-500 leading-tight\">Lösung: Neutrales Richter-Team (CEO/COO) einbinden.<\u002Fp>\n                            <\u002Fdiv>\n                        <\u002Fdiv>\n                    <\u002Fdiv>\n                <\u002Fdiv>\n\n                <!-- 5. KI Berater -->\n                <div class=\"card flex-1 border-violet-200 bg-white shadow-[0_0_20px_rgba(139,92,246,0.1)]\">\n                    <h2 class=\"text-xs font-bold uppercase tracking-widest text-violet-500 mb-2 flex items-center gap-1\">\n                        <svg class=\"w-4 h-4\" fill=\"currentColor\" viewBox=\"0 0 20 20\"><path d=\"M10 2a8 8 0 100 16 8 8 0 000-16zM8 11a1 1 0 11-2 0 1 1 0 012 0zm4 0a1 1 0 11-2 0 1 1 0 012 0zm-2 3.5c-1.33 0-2.5-.83-3-2h6c-.5 1.17-1.67 2-3 2z\"><\u002Fpath><\u002Fsvg>\n                        KI-Smarketing-Berater\n                    <\u002Fh2>\n                    <p class=\"text-[10px] text-slate-500 mb-3\">Berechne SLA-Metriken (z.B. \"MQLs für 1 Mio. Umsatz?\") oder löse Konflikte.<\u002Fp>\n                    \n                    <textarea id=\"aiInput\" rows=\"2\" class=\"w-full p-2 text-[11px] bg-slate-50 border border-slate-200 rounded-lg focus:ring-2 focus:ring-violet-500 focus:border-violet-500 outline-none resize-none mb-2 custom-scrollbar\" placeholder=\"Beispiel: Wir wollen 500k€ Umsatz machen. Ein Deal bringt ca. 5k€. SQL zu Win-Rate = 20%, MQL zu SQL = 25%. Wie viele MQLs brauchen wir?\"><\u002Ftextarea>\n                    \n                    <div class=\"flex justify-between items-center mb-2\">\n                        <span id=\"aiStatus\" class=\"text-[10px] text-slate-400 italic hidden flex items-center\">\n                            <svg class=\"animate-spin -ml-1 mr-1 h-3 w-3 text-violet-500 inline\" xmlns=\"http://www.w3.org/2000/svg\" fill=\"none\" viewBox=\"0 0 24 24\"><circle class=\"opacity-25\" cx=\"12\" cy=\"12\" r=\"10\" stroke=\"currentColor\" stroke-width=\"4\"><\u002Fcircle><path class=\"opacity-75\" fill=\"currentColor\" d=\"M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z\"><\u002Fpath><\u002Fsvg>\n                            Analysiert...\n                        <\u002Fspan>\n                        <button id=\"askAiBtn\" class=\"ml-auto bg-violet-600 hover:bg-violet-700 text-white text-[11px] font-bold py-1.5 px-4 rounded-md transition-colors shadow-sm\">\n                            Fragen\n                        <\u002Fbutton>\n                    <\u002Fdiv>\n\n                    <div id=\"aiResponseContainer\" class=\"flex-1 overflow-y-auto custom-scrollbar pr-1 hidden border-t border-slate-100 pt-2 mt-1\">\n                        <div id=\"aiResponseText\" class=\"text-[11px] text-slate-700 whitespace-pre-line leading-relaxed\"><\u002Fdiv>\n                    <\u002Fdiv>\n                <\u002Fdiv>\n\n            <\u002Fdiv>\n        <\u002Fdiv>\n        \n        <!-- Footer Info Overlay -->\n        <div class=\"absolute bottom-2 left-6 text-[9px] font-bold text-slate-300 uppercase tracking-widest\">\n            DBA Digital Business Akademie\n        <\u002Fdiv>\n    <\u002Fdiv>\n\n    <script>\n        // 1. Horizontal Funnel Chart\n        const ctxFunnel = document.getElementById('funnelChart').getContext('2d');\n        new Chart(ctxFunnel, {\n            type: 'bar',\n            data: {\n                labels: ['MQL (Marketing)', 'SQL (Sales)', 'Won (Umsatz)'],\n                datasets: [{\n                    data: [1000, 300, 45],\n                    backgroundColor: ['#F97316', '#3B82F6', '#10B981'], // Orange, Blue, Green\n                    borderRadius: 4,\n                    barPercentage: 0.6\n                }]\n            },\n            options: {\n                indexAxis: 'y',\n                maintainAspectRatio: false,\n                plugins: {\n                    legend: { display: false },\n                    tooltip: { enabled: false }\n                },\n                scales: {\n                    x: { display: false },\n                    y: {\n                        grid: { display: false },\n                        border: { display: false },\n                        ticks: { color: '#475569', font: { family: 'Inter', weight: '600', size: 10 } }\n                    }\n                },\n                animation: { duration: 0 } // No animation for print-ready slide look\n            }\n        });\n\n        // 2. Speed to Lead Gauge (Half Donut)\n        const ctxSpeed = document.getElementById('speedChart').getContext('2d');\n        new Chart(ctxSpeed, {\n            type: 'doughnut',\n            data: {\n                labels: ['> 5 Min (Verloren)', '< 5 Min (Kontakt)'],\n                datasets: [{\n                    data: [80, 20],\n                    backgroundColor: ['#E2E8F0', '#3B82F6'], // Light Gray and Sales Blue\n                    borderWidth: 0,\n                    circumference: 180,\n                    rotation: 270\n                }]\n            },\n            options: {\n                maintainAspectRatio: false,\n                plugins: {\n                    legend: { display: false },\n                    tooltip: { enabled: false }\n                },\n                cutout: '75%',\n                animation: { duration: 0 }\n            }\n        });\n\n        // 3. AI Assistant Logic\n        const aiInput = document.getElementById('aiInput');\n        const askAiBtn = document.getElementById('askAiBtn');\n        const aiStatus = document.getElementById('aiStatus');\n        const aiResponseContainer = document.getElementById('aiResponseContainer');\n        const aiResponseText = document.getElementById('aiResponseText');\n\n        async function fetchWithRetry(url, options, retries = 3, delay = 1000) {\n            try {\n                const res = await fetch(url, options);\n                if (!res.ok && res.status === 429 && retries > 0) {\n                    await new Promise(resolve => setTimeout(resolve, delay));\n                    return fetchWithRetry(url, options, retries - 1, delay * 2);\n                }\n                return res;\n            } catch (err) {\n                if (retries > 0) {\n                    await new Promise(resolve => setTimeout(resolve, delay));\n                    return fetchWithRetry(url, options, retries - 1, delay * 2);\n                }\n                throw err;\n            }\n        }\n\n        askAiBtn.addEventListener('click', async () => {\n            const prompt = aiInput.value.trim();\n            if (!prompt) return;\n\n            askAiBtn.disabled = true;\n            askAiBtn.classList.add('opacity-50', 'cursor-not-allowed');\n            aiStatus.classList.remove('hidden');\n            aiResponseContainer.classList.add('hidden');\n            aiResponseText.innerHTML = '';\n\n            const systemPrompt = `Du bist ein \"Smarketing\" Experte. Antworte EXTREM kurz und prägnant (max 3-4 Sätze oder kurze Bulletpoints). \n            Deine Aufgabe ist es, SLA-Berechnungen durchzuführen oder Smarketing-Konflikte zu lösen. \n            Antworte auf Deutsch. Nutze einfache Formatierungen wie **fett** für wichtige Zahlen.`;\n\n            const apiKey = \"\"; // API Key handled by Canvas\n            const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-3-flash-preview:generateContent?key=${apiKey}`;\n\n            const payload = {\n                contents: [{ parts: [{ text: prompt }] }],\n                systemInstruction: { parts: [{ text: systemPrompt }] }\n            };\n\n            try {\n                const response = await fetchWithRetry(apiUrl, {\n                    method: 'POST',\n                    headers: { 'Content-Type': 'application/json' },\n                    body: JSON.stringify(payload)\n                });\n\n                const result = await response.json();\n                \n                if (result.candidates && result.candidates[0] && result.candidates[0].content.parts[0]) {\n                    let text = result.candidates[0].content.parts[0].text;\n                    // Bold formatting\n                    text = text.replace(/\\*\\*(.*?)\\*\\*/g, '<strong>$1<\u002Fstrong>');\n                    aiResponseText.innerHTML = text;\n                    aiResponseContainer.classList.remove('hidden');\n                } else {\n                    aiResponseText.innerText = \"Fehler bei der Verarbeitung.\";\n                    aiResponseContainer.classList.remove('hidden');\n                }\n            } catch (error) {\n                console.error(\"API Error:\", error);\n                aiResponseText.innerText = \"Verbindungsfehler zur KI.\";\n                aiResponseContainer.classList.remove('hidden');\n            } finally {\n                askAiBtn.disabled = false;\n                askAiBtn.classList.remove('opacity-50', 'cursor-not-allowed');\n                aiStatus.classList.add('hidden');\n            }\n        });\n    <\u002Fscript>\n\n<\u002Fbody><\u002Fhtml>"
  </script>
